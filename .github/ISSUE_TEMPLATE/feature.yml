name: Feature request
description: Suggest a focused improvement to ProveIt
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Verification problem
      description: Which completion claim is difficult to verify today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest portable solution.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: How should the improvement prove that it works?
    validations:
      required: true
