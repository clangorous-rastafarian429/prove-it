name: Bug report
description: Report incorrect behavior in the skill, adapters, installer, or recorder
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Canonical skill
        - Evidence recorder
        - Bash installer
        - PowerShell installer
        - Cursor adapter
        - GitHub Copilot adapter
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v1.0.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction without secrets.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include commands and relevant redacted output.
    validations:
      required: true
