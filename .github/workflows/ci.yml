name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile skills/prove-it/scripts/evidence.py
      - run: python tests/validate_skill.py
      - if: runner.os != 'Windows'
        run: bash -n install.sh uninstall.sh
      - if: runner.os != 'Windows'
        run: bash tests/test_installer.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $allErrors = @()
          foreach ($file in @("install.ps1", "uninstall.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            $allErrors += $parseErrors
          }
          if ($allErrors.Count -gt 0) { $allErrors | Write-Error; exit 1 }
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "proveit-project"
          New-Item -ItemType Directory -Force -Path (Join-Path $project ".github"), (Join-Path $project ".claude"), (Join-Path $project ".cursor") | Out-Null
          ./install.ps1 -Agent All -Scope Project -ProjectPath $project
          $paths = @(
            (Join-Path $project ".agents/skills/prove-it/SKILL.md"),
            (Join-Path $project ".claude/skills/prove-it/SKILL.md"),
            (Join-Path $project ".cursor/rules/prove-it.mdc"),
            (Join-Path $project ".github/instructions/prove-it.instructions.md")
          )
          foreach ($path in $paths) { if (-not (Test-Path $path)) { throw "Missing installed file: $path" } }
          ./uninstall.ps1 -Agent All -Scope Project -ProjectPath $project
          foreach ($path in $paths) { if (Test-Path $path) { throw "File was not removed: $path" } }
